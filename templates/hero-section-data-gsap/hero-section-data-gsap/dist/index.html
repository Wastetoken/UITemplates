<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Hero section: Data GSAP</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

<body>

  <div class="container">

    <nav class="gsap-nav">
      <div class="logo">
        <div class="logo-icon"></div>
        Traffo
      </div>
      <ul class="nav-links">
        <li>Analytics</li>
        <li class="has-dropdown">Features</li>
        <li>Blog</li>
        <li>Get in touch</li>
      </ul>
      <button class="btn-outline">Start for free &rarr;</button>
    </nav>

    <main class="hero">

      <div class="left-col">
        <h1 class="gsap-left">Convert traffic<br>and get better<br>conversions</h1>
        <p class="desc gsap-left">No more lost data. From now you can get the best output of your traffic and maximize every conversion rate.</p>
        <div class="gsap-left">
          <button class="btn-dark">Start for free &rarr;</button>
        </div>

        <div class="workspace-features gsap-left">
          <div class="wf-header">
            <h3>Workspace features</h3>
            <a href="#">Learn more</a>
          </div>
          <div class="wf-cards">
            <div class="wf-card wf-1 float-anim">
              <svg viewBox="0 0 24 24">
                <line x1="5" y1="19" x2="19" y2="5"></line>
                <polyline points="5 5 19 5 19 19"></polyline>
              </svg>
            </div>
            <div class="wf-card wf-2 float-anim-alt">
              <div class="shape-tr"></div>
              <div class="shape-ci"></div>
            </div>
            <div class="wf-card wf-3 float-anim">
              <svg viewBox="0 0 24 24">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="9" y1="3" x2="9" y2="21"></line>
                <line x1="15" y1="3" x2="15" y2="21"></line>
                <line x1="3" y1="9" x2="21" y2="9"></line>
                <line x1="3" y1="15" x2="21" y2="15"></line>
              </svg>
              <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"></path>
              </svg>
            </div>
          </div>
        </div>
      </div>

      <div class="right-col">

        <svg class="lines-container" viewBox="0 0 600 600" preserveAspectRatio="none">
          <path class="line-path" d="M 300 240 Q 300 120 150 120" />
          <path class="line-path" d="M 300 240 Q 300 120 450 120" />
          <path class="line-path" d="M 300 240 L 300 60" />
          <path class="line-path" d="M 210 270 Q 150 270 120 270" />
          <path class="line-path" d="M 390 270 Q 450 270 480 270" />
          <path class="line-path" d="M 300 300 Q 300 420 160 420" />
          <path class="line-path" d="M 300 300 Q 300 420 440 420" />
          <path class="line-path" d="M 200 450 Q 200 520 300 520" />
          <path class="line-path" d="M 400 450 Q 400 520 300 520" />
        </svg>

        <div class="node-container n-top-small">
          <div class="node clay-float">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </div>
        </div>

        <div class="node-container n-tl">
          <div class="node clay-float">
            <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=200&auto=format&fit=crop" alt="Graphic" style="filter: grayscale(1) opacity(0.8) mix-blend-mode(multiply);">
          </div>
        </div>

        <div class="node-container n-tr">
          <div class="node clay-float-alt">
            <img src="https://images.unsplash.com/photo-1551288049-bebda4e38f71?q=80&w=200&auto=format&fit=crop" alt="Chart" style="filter: sepia(1) hue-rotate(10deg) opacity(0.8);">
          </div>
        </div>

        <div class="node-container n-ml">
          <div class="node clay-float-alt">
            <img src="https://images.unsplash.com/photo-1558591710-4b4a1ae0f04d?q=80&w=200&auto=format&fit=crop" alt="Cloud" style="filter: grayscale(1) opacity(0.7) mix-blend-mode(multiply);">
          </div>
        </div>

        <div class="node-container n-center">
          <div class="node float-anim">
            <img src="https://images.unsplash.com/photo-1633535975001-c8008800b6d2?q=80&w=300&auto=format&fit=crop" alt="Database Cylinder">
          </div>
        </div>

        <div class="node-container n-mr">
          <div class="node clay-float">
            <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?q=80&w=200&auto=format&fit=crop" alt="Thumbs Up" style="filter: grayscale(1) opacity(0.6) mix-blend-mode(multiply);">
          </div>
        </div>

        <div class="node-container n-bl">
          <div class="node clay-float-alt">
            <img src="https://images.unsplash.com/photo-1560250097-0b93528c311a?q=80&w=200&auto=format&fit=crop" alt="User Loop" style="filter: sepia(1) hue-rotate(10deg) opacity(0.7);">
          </div>
        </div>

        <div class="node-container n-bl-small">
          <div class="node clay-float">
            <svg viewBox="0 0 24 24">
              <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"></path>
              <path d="M13 13l6 6"></path>
            </svg>
          </div>
        </div>

        <div class="node-container n-br">
          <div class="node clay-float">
            <img src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?q=80&w=200&auto=format&fit=crop" alt="Globe" style="filter: grayscale(1) opacity(0.5) mix-blend-mode(multiply);">
          </div>
        </div>

        <div class="node-container n-br-small">
          <div class="node clay-float-alt">
            <svg viewBox="0 0 24 24">
              <path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path>
            </svg>
          </div>
        </div>

        <div class="node-container n-bottom">
          <div class="node clay-float">
            <img src="https://images.unsplash.com/photo-1605100804763-247f67b4549e?q=80&w=200&auto=format&fit=crop" alt="Hex" style="filter: grayscale(1) opacity(0.6) mix-blend-mode(multiply);">
          </div>
        </div>

        <svg class="deco-star float-anim" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2">
          <path d="M12 2v20M2 12h20M4.93 4.93l14.14 14.14M4.93 19.07L19.07 4.93" />
        </svg>

      </div>
    </main>

  </div>
    <script  src="./script.js"></script>

  </body>
  
</html>
