<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Hero section</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <!-- Sora: clean geometric sans with strong heavy weights -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- GSAP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<div class="page">

  <!-- ============= NAV ============= -->
  <nav>
    <div class="nav-left">
      <span class="avatar-nav">
        <svg class="fb-face" viewBox="0 0 42 42" xmlns="http://www.w3.org/2000/svg">
          <circle cx="21" cy="16" r="7" fill="rgba(255,255,255,0.45)" />
          <path d="M 6 40 Q 6 26 21 26 Q 36 26 36 40 Z" fill="rgba(255,255,255,0.45)" />
        </svg>
        <img src="https://i.pravatar.cc/100?img=12" alt="" aria-hidden="true" />
      </span>
      <span class="name">Charlie Hoehn</span>
    </div>

    <div class="nav-pill">
      <a href="#">Authors</a>
      <a href="#">Books</a>
      <a href="#">Speaking</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </div>

    <div class="nav-right">
      <button class="search-btn" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.7" />
          <path d="M 17 17 L 21 21" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
        </svg>
      </button>
      <a href="#" class="signin">Sign in</a>
    </div>
  </nav>

  <!-- ============= HERO ============= -->
  <main class="hero">

    <!-- Label tag -->
    <div class="label-tag">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="4" width="16" height="16" rx="3" stroke="currentColor" stroke-width="1.6" />
        <path d="M 8 4 V 20" stroke="currentColor" stroke-width="1.6" />
      </svg>
      Create legendary books
    </div>

    <!-- Headline -->
    <h1 class="headline">
      <div class="h-line">
        <span class="h-item word">How</span>
        <span class="h-item word">to</span>
        <span class="h-item word">Sell</span>

        <!-- White 3D key with bookmark icon -->
        <span class="h-item key key-white" id="keyWhite">
          <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Bookmark / page icon -->
            <path d="M 10 5 L 22 5 Q 24 5 24 7 L 24 27 L 16 22 L 8 27 L 8 7 Q 8 5 10 5 Z" fill="currentColor" opacity="0.85" />
            <path d="M 10 5 L 22 5 Q 24 5 24 7 L 24 27 L 16 22 L 8 27 L 8 7 Q 8 5 10 5 Z" fill="none" stroke="currentColor" stroke-width="0.6" opacity="0.4" />
          </svg>
        </span>

        <span class="h-item word">1M</span>
        <span class="h-item word">Copies:</span>
        <span class="h-item word">Breakdowns</span>
      </div>

      <div class="h-line">
        <span class="h-item word">from</span>
        <span class="h-item word">4x</span>
        <span class="h-item word">NYT</span>

        <span class="h-item bestselling" id="bestselling">Bestselling</span>

        <!-- Pink 3D key with pencil icon -->
        <span class="h-item key key-pink" id="keyPink">
          <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Pencil / edit icon -->
            <path d="M 21 5 L 26 10 L 12 24 L 6 26 L 8 20 L 21 5 Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" fill="rgba(255,255,255,0.15)" />
            <path d="M 19 7 L 24 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </span>

        <span class="h-item word">Editor</span>
      </div>
    </h1>

    <!-- Cursor blinking -->
    <div class="cursor-line">
      <span class="cursor"></span>
    </div>

    <!-- Subtitle + Subscribe form -->
    <div class="below">
      <p class="subtitle">
        I help bestselling authors and entrepreneurs elevate their books, brands, and businesses.
      </p>

      <div class="subscribe-bar">
        <input type="email" id="emailInput" placeholder="Email_" />
        <button id="subBtn">Subscribe</button>
      </div>
    </div>

  </main>
</div>
    <script  src="./script.js"></script>

  </body>
  
</html>
