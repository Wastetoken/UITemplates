<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">

<div class="bento-container">

  <div class="logo-box clay clay-blue bento-item">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
    </svg>
    Hex<span style="font-size: 0.5em; position: relative; top: -10px;">®</span>
  </div>

  <div class="nav-area bento-item">
    <div class="nav-links">
      <span>Collections</span>
      <span>Product</span>
      <span>Our Story</span>
    </div>
    <button class="btn-signup">Sign Up</button>
  </div>

  <div class="woman-card clay bento-item">
    <img src="https://images.unsplash.com/photo-1616091216791-a0260c5eb3be?q=80&w=600&auto=format&fit=crop" alt="AI Generated Model">
  </div>

  <div class="vr-card clay bento-item">
    <img src="https://images.unsplash.com/photo-1622979135225-d2ba269cf1ac?q=80&w=400&auto=format&fit=crop" alt="VR Headset" style="mix-blend-mode: multiply; border-radius: 20px;">
  </div>

  <div class="nft-card clay clay-white bento-item">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
    </svg>
    <h4>NFT Design<br>Awards</h4>
  </div>

  <div class="hero-card clay bento-item">
    <h1>GENERATE 3D<br>WITH AI</h1>
    <p>The AI 3D model generator is a powerful tool for architects and construction professionals.</p>
    <div class="hero-actions">
      <button class="btn-primary">JOIN COMMUNITY</button>
      <button class="icon-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
      </button>
      <button class="icon-btn blue">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>
    </div>
  </div>

  <div class="creators-card clay clay-white bento-item">
    <h5>Our<br>creators</h5>
    <div class="avatars">
      <img src="https://i.pravatar.cc/100?img=1" alt="avatar">
      <img src="https://i.pravatar.cc/100?img=2" alt="avatar">
      <img src="https://i.pravatar.cc/100?img=3" alt="avatar">
    </div>
  </div>

  <div class="circle-card clay bento-item">
    <svg class="circle-text-svg" viewBox="0 0 100 100">
      <path id="circlePath" d="M 50, 50 m -35, 0 a 35,35 0 1,1 70,0 a 35,35 0 1,1 -70,0" fill="none" />
      <text fill="#ffffff" font-size="7.5" font-weight="700" letter-spacing="3.5">
        <textPath href="#circlePath" startOffset="0%">
          explore now how it works • explore now how it works •
        </textPath>
      </text>
    </svg>
    <div class="crosshair">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M5 12h14M12 5v14M4 4l16 16M4 20L20 4"></path>
      </svg>
    </div>
  </div>

  <div class="cube-card clay bento-item">
    <img src="https://images.unsplash.com/photo-1620023616238-cd52d5b6b1fd?q=80&w=400&auto=format&fit=crop" alt="3D Cube">
  </div>

  <div class="release-card clay bento-item">
    <div class="release-header">
      <h5>NEW RELEASE</h5>
      <h2>Get ready to embark<br>on a new workroad</h2>
    </div>
    <div class="sleeve-img clay">
      <img src="https://images.unsplash.com/photo-1558222218-b7b54eede3f3?q=80&w=400&auto=format&fit=crop" alt="Sleeve Design">
    </div>

    <div class="release-footer">
      <div style="display: flex; gap: 15px; align-items: center;">
        <div class="pulse-dot"></div>
        <p style="max-width: 250px;">Exploring the Intersection of Virtual Reality and 3D</p>
      </div>
      <div>22.08.23</div>
      <div style="display: flex; gap: 5px;">
        <span style="display:block; width:8px; height:8px; background:#111; border-radius:50%;"></span>
        <span style="display:block; width:8px; height:8px; border:1px solid #111; border-radius:50%;"></span>
      </div>
    </div>
  </div>

</div>
