<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Interactive Node Flowchart: GSAP</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

<div class="scroll-instruction">↓ Scroll down to trace the flow ↓</div>

<div class="scroll-wrapper">
  <div class="canvas">

    <svg class="lines-layer" viewBox="0 0 2500 1000">
      <path class="line-path" d="M 100 500 L 400 500" />
      <path class="line-path" d="M 640 500 C 750 500, 800 200, 1000 200" />
      <path class="line-path" d="M 640 500 L 1000 500" />
      <path class="line-path" d="M 640 500 C 750 500, 800 800, 1000 800" />
      <path class="line-path" d="M 1240 500 L 1600 500" />
    </svg>

    <div class="clay-element connector-dot gs-reveal" style="left: 100px; top: 500px;"></div>
    <div class="clay-element plus-btn gs-reveal" style="left: 250px; top: 500px;">+</div>

    <div class="clay-element connector-dot gs-reveal" style="left: 400px; top: 500px;"></div>

    <div class="clay-element card gs-reveal" style="left: 520px; top: 500px;">
      <div class="card-video-wrap">
        <div class="overlay" style="background: rgba(220, 53, 69, 0.75);"></div>
        <img class="thumbnail" src="https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?auto=format&fit=crop&w=400&q=80" alt="Video">
        <div class="header-badges">
          <div class="badge-group">
            <span class="badge" style="background: #6f42c1;">1</span>
            <span class="badge" style="background: #e84118;">-30%</span>
          </div>
          <div class="badge icon">💬</div>
        </div>
        <div class="title">Welcome</div>
      </div>
      <div class="card-stats">
        <span>👤 100</span>
        <span>👁️ 78</span>
        <span>✅ 70</span>
      </div>
    </div>

    <div class="clay-element connector-dot gs-reveal" style="left: 640px; top: 500px;"></div>

    <div class="clay-element plus-btn gs-reveal" style="left: 790px; top: 350px;">+</div>
    <div class="clay-element plus-btn gs-reveal" style="left: 820px; top: 500px;">+</div>
    <div class="clay-element plus-btn gs-reveal" style="left: 790px; top: 650px;">+</div>

    <div class="clay-element connector-dot gs-reveal" style="left: 1000px; top: 200px;"></div>
    <div class="clay-element card gs-reveal" style="left: 1120px; top: 200px;">
      <div class="card-video-wrap">
        <div class="overlay" style="background: rgba(46, 204, 113, 0.75);"></div>
        <img class="thumbnail" src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=400&q=80" alt="Video">
        <div class="header-badges">
          <div class="badge-group">
            <span class="badge" style="background: #6f42c1;">2</span>
            <span class="badge" style="background: #27ae60;">+12%</span>
          </div>
          <div class="badge icon">🎥</div>
        </div>
        <div class="title">Onboarding</div>
      </div>
      <div class="card-stats">
        <span>👤 85</span>
        <span>👁️ 62</span>
        <span>✅ 55</span>
      </div>
    </div>

    <div class="clay-element connector-dot gs-reveal" style="left: 1000px; top: 500px;"></div>
    <div class="clay-element card gs-reveal" style="left: 1120px; top: 500px;">
      <div class="card-video-wrap">
        <div class="overlay" style="background: rgba(108, 92, 231, 0.75);"></div>
        <img class="thumbnail" src="https://images.unsplash.com/photo-1555952517-2e8e729e0b44?auto=format&fit=crop&w=400&q=80" alt="Video">
        <div class="header-badges">
          <div class="badge-group">
            <span class="badge" style="background: #e84393;">3</span>
            <span class="badge" style="background: #747d8c;">-7.4%</span>
          </div>
          <div class="badge icon">🔗</div>
        </div>
        <div class="title">Tutorials</div>
      </div>
      <div class="card-stats">
        <span>👤 54</span>
        <span>👁️ 30</span>
        <span>✅ 18</span>
      </div>
    </div>

    <div class="clay-element connector-dot gs-reveal" style="left: 1000px; top: 800px;"></div>
    <div class="clay-element card gs-reveal" style="left: 1120px; top: 800px;">
      <div class="card-video-wrap">
        <div class="overlay" style="background: rgba(52, 152, 219, 0.75);"></div>
        <img class="thumbnail" src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=400&q=80" alt="Video">
        <div class="header-badges">
          <div class="badge-group">
            <span class="badge" style="background: #6f42c1;">4</span>
            <span class="badge" style="background: #e67e22;">+45%</span>
          </div>
          <div class="badge icon">🛒</div>
        </div>
        <div class="title">Checkout</div>
      </div>
      <div class="card-stats">
        <span>👤 120</span>
        <span>👁️ 110</span>
        <span>✅ 95</span>
      </div>
    </div>

    <div class="clay-element connector-dot gs-reveal" style="left: 1240px; top: 500px;"></div>
    <div class="clay-element plus-btn gs-reveal" style="left: 1420px; top: 500px;">+</div>

    <div class="clay-element connector-dot gs-reveal" style="left: 1600px; top: 500px;"></div>
    <div class="clay-element card gs-reveal" style="left: 1720px; top: 500px;">
      <div class="card-video-wrap">
        <div class="overlay" style="background: rgba(232, 67, 147, 0.75);"></div>
        <img class="thumbnail" src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=400&q=80" alt="Video">
        <div class="header-badges">
          <div class="badge-group">
            <span class="badge" style="background: #0984e3;">5</span>
            <span class="badge" style="background: #00b894;">100%</span>
          </div>
          <div class="badge icon">🎉</div>
        </div>
        <div class="title">Success End</div>
      </div>
      <div class="card-stats">
        <span>👤 40</span>
        <span>👁️ 40</span>
        <span>✅ 40</span>
      </div>
    </div>

  </div>
</div>
    <script  src="./script.js"></script>

  </body>
  
</html>
