<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

<div class="container">

  <div class="left-col">
    <div class="badge fade-up"><span class="dot"></span> Get exclusives</div>

    <h1 class="title">
      <span class="title-row fade-up">ENHANCE</span>
      <span class="title-row middle fade-up">
        Y<span class="star-o">O</span>UR
        <div class="trial-btn floating">7-day trial</div>
      </span>
      <span class="title-row fade-up">PR&Oslash;CESS</span>
    </h1>

    <div class="left-bottom">
      <div class="saas-card floating-slow fade-up">
        <span>SaaS<br>Awards '23</span>
        <div class="spheres-container">
          <div class="sphere sp-1"></div>
          <div class="sphere sp-2"></div>
          <div class="sphere sp-3"></div>
          <div class="sphere sp-4"></div>
        </div>
      </div>

      <div class="stats-text fade-up">
        <h2>1M <span class="moon-icon"></span> /23</h2>
        <p><strong>320+ programs on Vault</strong> mean endless discovery and instant solutions for all of your needs.</p>
      </div>
    </div>
  </div>

  <div class="right-col">

    <div class="line-vertical"></div>
    <div class="node n1"></div>
    <div class="line-angled-1"></div>
    <div class="node n2"></div>
    <div class="line-angled-2"></div>
    <div class="node n3"></div>

    <div class="scroll-pill top floating">
      <svg viewBox="0 0 24 24">
        <path d="M12 20L12 4M12 20L6 14M12 20L18 14" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </div>
    <div class="scroll-pill bottom floating">
      <svg viewBox="0 0 24 24">
        <path d="M12 20L12 4M12 20L6 14M12 20L18 14" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </div>

    <div class="main-img-card fade-up clay-hover">
      <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=600&q=80" alt="Man looking up">
    </div>

    <div class="gift-card-pill floating clay-hover">
      <svg viewBox="0 0 24 24">
        <path d="M12 2L2 7l10 5 10-5-10-5zm0 20l10-5v-5l-10 5-10-5v5l10 5z" />
      </svg>
      <span>Gift<br>Cards</span>
    </div>

    <div class="dark-card floating-slow clay-hover">
      <svg class="triangle" viewBox="0 0 24 24">
        <path d="M12 2L22 20H2L12 2Z" />
      </svg>
      <span class="label">Your Goals</span>

      <div class="progress-ring">
        <svg viewBox="0 0 100 100">
          <circle class="bg" cx="50" cy="50" r="40"></circle>
          <circle class="fg-green" cx="50" cy="50" r="40"></circle>
          <circle class="fg-beige" cx="50" cy="50" r="40"></circle>
        </svg>
        <div class="percent">74%</div>
      </div>
    </div>

    <div class="price-bubble floating clay-hover">
      <h3>$14.99</h3>
      <span>/month</span>
    </div>

    <p class="bottom-desc fade-up">
      Many programs.<br>One subscription.
    </p>

  </div>

</div>
