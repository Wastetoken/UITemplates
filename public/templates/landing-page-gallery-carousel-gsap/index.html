<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Landing page: Gallery / carousel GSAP</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

<div class="grid-bg"></div>

<div class="container">

  <div class="avatars-wrapper">
    <div class="avatar-card interactive c1"><img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=200&q=80" alt="Professional"></div>
    <div class="avatar-card interactive c2"><img src="https://images.unsplash.com/photo-1560250097-0b93528c311a?w=200&q=80" alt="Professional"></div>
    <div class="avatar-card interactive c3"><img src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=200&q=80" alt="Professional"></div>
    <div class="avatar-card interactive c4"><img src="https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?w=200&q=80" alt="Professional"></div>
    <div class="avatar-card interactive c5"><img src="https://images.unsplash.com/photo-1557862921-37829c790f19?w=200&q=80" alt="Professional"></div>
    <div class="avatar-card interactive c6"><img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=200&q=80" alt="Professional"></div>
    <div class="avatar-card interactive c7"><img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200&q=80" alt="Professional"></div>
    <div class="avatar-card interactive c8"><img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=200&q=80" alt="Professional"></div>
    <div class="avatar-card interactive c9"><img src="https://images.unsplash.com/photo-1580489944761-15a19d654956?w=200&q=80" alt="Professional"></div>
    <div class="avatar-card interactive c10"><img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=200&q=80" alt="Professional"></div>
    <div class="avatar-card interactive c11"><img src="https://images.unsplash.com/photo-1513379733131-47fc74b45fc7?w=200&q=80" alt="Professional"></div>
    <div class="avatar-card interactive c12"><img src="https://images.unsplash.com/photo-1531123897727-8f129e1bf98c?w=200&q=80" alt="Professional"></div>
    <div class="avatar-card interactive c13"><img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=200&q=80" alt="Professional"></div>
    <div class="avatar-card interactive c14"><img src="https://images.unsplash.com/photo-1522075469751-3a6694fb2f61?w=200&q=80" alt="Professional"></div>
  </div>

  <div class="content">
    <div class="tag-pill gsap-reveal">Testimonials</div>
    <h1 class="gsap-reveal">
      Trusted by leaders<br>
      <span class="text-gray">from various industries</span>
    </h1>
    <p class="subheading gsap-reveal">
      Learn why professionals trust our solutions to<br>complete their customer journeys.
    </p>
    <button class="cta-btn gsap-reveal">
      Read Success Stories
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </button>
  </div>

</div>
    <script  src="./script.js"></script>

  </body>
  
</html>
