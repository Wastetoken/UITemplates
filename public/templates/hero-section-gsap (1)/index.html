<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Hero section: GSAP</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Caveat&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

<div class="container">

  <div class="col-left">
    <div class="stat-group gsap-fade-left">
      <div class="stat-number">1.2 M</div>
      <div class="stat-desc">Deification and worship<br>of natural phenomena</div>
    </div>

    <div class="circle-widget gsap-fade-left">
      <svg class="circle-text" viewBox="0 0 100 100">
        <path id="circlePath" d="M 50, 50 m -40, 0 a 40,40 0 1,1 80,0 a 40,40 0 1,1 -80,0" fill="none" />
        <text>
          <textPath href="#circlePath" startOffset="0%">OUR EXCLUSIVE ARTICLES • OUR EXCLUSIVE ARTICLES • </textPath>
        </text>
      </svg>
      <div class="vertical-line"></div>
    </div>

    <div class="bottom-text gsap-fade-left">
      THE ASSIGNMENT<br>OF A PHYSICAL<br>EORLTO A COR<br>PHIAMDSAH.
    </div>
  </div>

  <div class="col-center">
    <div class="grid-container">
      <div class="tile col-0" style="--x: 0px; --y: 190px;"></div>
      <div class="tile col-0" style="--x: 0px; --y: 330px;"></div>

      <div class="tile col-1" style="--x: 110px; --y: 30px;"></div>
      <div class="tile col-1" style="--x: 110px; --y: 170px;"></div>
      <div class="tile col-1" style="--x: 110px; --y: 310px;"></div>
      <div class="tile col-1" style="--x: 110px; --y: 450px;"></div>

      <div class="tile col-2" style="--x: 220px; --y: 0px;"></div>
      <div class="tile col-2" style="--x: 220px; --y: 140px;"></div>
      <div class="tile col-2" style="--x: 220px; --y: 280px;"></div>
      <div class="tile col-2" style="--x: 220px; --y: 420px;"></div>

      <div class="tile col-3" style="--x: 330px; --y: 180px;"></div>
      <div class="tile col-3" style="--x: 330px; --y: 320px;"></div>
    </div>
  </div>

  <div class="col-right">
    <div class="discover-btn gsap-fade-right">
      <div class="discover-circle"></div>
      <div class="discover-text">Discover more</div>
    </div>

    <div class="participants-section gsap-fade-right">
      <h3>Participants</h3>
      <div class="avatars-wrapper">
        <div class="avatars">
          <img src="https://i.pravatar.cc/100?img=33" alt="Participant">
          <img src="https://i.pravatar.cc/100?img=47" alt="Participant">
          <img src="https://i.pravatar.cc/100?img=68" alt="Participant">
        </div>
        <div class="more-text">10+<br>More</div>
      </div>
    </div>

    <hr class="separator gsap-fade-right">

    <div class="quote-text gsap-fade-right">
      "Declension Natur is a feminine noun. Remember that, in German, both the spelling of the word."
    </div>

    <div class="signature gsap-fade-right">
      J. Anderson
    </div>
  </div>

</div>
    <script  src="./script.js"></script>

  </body>
  
</html>
