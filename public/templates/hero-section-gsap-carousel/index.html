<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Hero section: GSAP Carousel</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <header class="header">
  <p class="subtitle">Join the community</p>
  <h1 class="title">Let's connect</h1>
</header>
<section class="carousel-section">
  <div class="carousel-container">
    <div class="carousel-track">
      <div class="carousel-item"><img src="https://cdn.shopify.com/s/files/1/0185/5999/1872/files/cc-dp.jpg?v=1764280792" alt="Gallery Image 1"></div>
      <div class="carousel-item"><img src="https://cdn.shopify.com/s/files/1/0185/5999/1872/files/cc-serum.jpg?v=1764279474" alt="Gallery Image 2"></div>
      <div class="carousel-item"><img src="https://cdn.shopify.com/s/files/1/0185/5999/1872/files/dermd-products.png?v=1753033534" alt="Gallery Image 3"></div>
      <div class="carousel-item"><img src="https://cdn.shopify.com/s/files/1/0185/5999/1872/files/exf-square-02.jpg?v=1750856965" alt="Gallery Image 4"></div>
      <div class="carousel-item"><img src="https://cdn.shopify.com/s/files/1/0185/5999/1872/files/fes-square-01.webp?v=1733996576" alt="Gallery Image 5"></div>
      <div class="carousel-item"><img src="https://cdn.shopify.com/s/files/1/0185/5999/1872/files/lit-square-03.webp?v=1733734767" alt="Gallery Image 6"></div>
      <div class="carousel-item"><img src="https://cdn.shopify.com/s/files/1/0185/5999/1872/files/lit-square-02.webp?v=1733734767" alt="Gallery Image 7"></div>
    </div>
  </div>
</section>

<section class="form-section">
  <div class="form-wrapper">
    <input type="email" class="clay-input" placeholder="Email*">
    <button class="clay-btn">SUBMIT</button>
  </div>
  <p class="disclaimer">We respect your privacy. Unsubscribe anytime.</p>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script  src="./script.js"></script>

  </body>
  
</html>
