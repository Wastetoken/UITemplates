<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Hero section: GSAP</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

<div class="container">
  <div class="col-left">
    <div class="hero-stats gsap-fade">
      <h1>1.2 M</h1>
      <p>Deification and worship<br>of natural phenomena</p>
    </div>

    <div class="circle-graphic gsap-fade">
      <svg class="rotating-text" viewBox="0 0 100 100">
        <path id="circlePath" d="M 50, 50 m -40, 0 a 40,40 0 1,1 80,0 a 40,40 0 1,1 -80,0" />
        <text>
          <textPath href="#circlePath">EXCLUSIVE ARTICLES • OUR EXCLUSIVE ARTICLES • </textPath>
        </text>
      </svg>
      <div class="vertical-line"></div>
    </div>

    <div class="assignment-text gsap-fade">
      THE ASSIGNMENT<br>
      OF A PHYSICAL<br>
      EORMLTO A COR<br>
      PHIAMDSAH.
    </div>
  </div>

  <div class="col-center">
    <div class="grid-wrapper">
      <div class="tile-container t-anim" style="left: 100px; top: 30px; width: 90px; height: 80px;">
        <div class="tile-inner" style="background-position: -100px -30px;"></div>
      </div>
      <div class="tile-container t-anim-alt" style="left: 200px; top: 0px; width: 90px; height: 120px;">
        <div class="tile-inner" style="background-position: -200px 0px;"></div>
      </div>
      <div class="tile-container t-anim" style="left: 300px; top: 50px; width: 90px; height: 80px;">
        <div class="tile-inner" style="background-position: -300px -50px;"></div>
      </div>

      <div class="tile-container t-anim-alt" style="left: 0px; top: 120px; width: 90px; height: 150px;">
        <div class="tile-inner" style="background-position: 0px -120px;"></div>
      </div>
      <div class="tile-container t-anim" style="left: 100px; top: 120px; width: 90px; height: 160px;">
        <div class="tile-inner" style="background-position: -100px -120px;"></div>
      </div>
      <div class="tile-container t-anim-alt" style="left: 200px; top: 130px; width: 90px; height: 100px;">
        <div class="tile-inner" style="background-position: -200px -130px;"></div>
      </div>
      <div class="tile-container t-anim" style="left: 300px; top: 140px; width: 90px; height: 160px;">
        <div class="tile-inner" style="background-position: -300px -140px;"></div>
      </div>

      <div class="tile-container t-anim-alt" style="left: 100px; top: 290px; width: 90px; height: 100px;">
        <div class="tile-inner" style="background-position: -100px -290px;"></div>
      </div>
      <div class="tile-container t-anim" style="left: 200px; top: 240px; width: 90px; height: 140px;">
        <div class="tile-inner" style="background-position: -200px -240px;"></div>
      </div>
      <div class="tile-container t-anim-alt" style="left: 300px; top: 310px; width: 90px; height: 110px;">
        <div class="tile-inner" style="background-position: -300px -310px;"></div>
      </div>

      <div class="tile-container t-anim" style="left: 100px; top: 400px; width: 90px; height: 120px;">
        <div class="tile-inner" style="background-position: -100px -400px;"></div>
      </div>
      <div class="tile-container t-anim-alt" style="left: 200px; top: 390px; width: 90px; height: 130px;">
        <div class="tile-inner" style="background-position: -200px -390px;"></div>
      </div>

    </div>
  </div>

  <div class="col-right">
    <div class="btn-discover gsap-fade">
      <div class="icon-outline">
        <div class="icon-dot"></div>
      </div>
      Discover more
    </div>

    <div class="participants-section gsap-fade">
      <h3>Participants</h3>
      <div class="avatars-wrapper">
        <div class="avatars">
          <img src="https://i.pravatar.cc/100?img=11" alt="Participant 1">
          <img src="https://i.pravatar.cc/100?img=32" alt="Participant 2">
          <img src="https://i.pravatar.cc/100?img=68" alt="Participant 3">
        </div>
        <div class="more-text">10+<br>More</div>
      </div>
      <div class="divider"></div>
    </div>

    <p class="description gsap-fade">
      "Declension Natur is a feminine noun. Remember that, in German, both the spelling of the word."
    </p>

    <div class="illegible-text gsap-fade">
      <div class="line short" style="background: #2a332e; height: 8px;"></div>
      <div class="line long"></div>
      <div class="line medium"></div>
    </div>
  </div>
</div>
    <script  src="./script.js"></script>

  </body>
  
</html>
